name: Azure OIDC Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Azure identity and access
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read Static Web App details
        env:
          SWA_RESOURCE_ID: ${{ vars.AZURE_STATIC_WEB_APP_RESOURCE_ID }}
        run: |
          if [ -z "$SWA_RESOURCE_ID" ]; then
            echo "AZURE_STATIC_WEB_APP_RESOURCE_ID is missing."
            exit 1
          fi

          az resource show \
            --ids "$SWA_RESOURCE_ID" \
            --query "{name:name, type:type, location:location}" \
            --output table